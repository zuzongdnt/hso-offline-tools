name: Trace native storage metadata
on:
  workflow_dispatch:
jobs:
  trace:
    runs-on: macos-15
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: gluonhq/setup-graalvm@3a9b11a45ef0ecad69107f5884b5dbbb7b806e1c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          graalvm: '22.1.0.1-Final'
          jdk: java17
          arch: aarch64
      - name: Record SQLite reflection and resources
        run: |
          mvn -B package dependency:copy-dependencies -DincludeScope=runtime
          mkdir -p storage metadata
          python3 -c "import sqlite3; c=sqlite3.connect('storage/hso.sqlite'); c.execute('create table seed (id integer)'); c.commit(); c.close()"
          java -agentlib:native-image-agent=config-merge-dir=metadata -cp 'target/classes:target/test-classes:target/dependency/*' offline.SQLiteCheck storage write
          java -agentlib:native-image-agent=config-merge-dir=metadata -cp 'target/classes:target/test-classes:target/dependency/*' offline.SQLiteCheck storage read
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-metadata
          path: metadata/*.json
          retention-days: 7
