name: Check native offline storage
on:
  workflow_dispatch:
jobs:
  storage:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: gluonhq/setup-graalvm@3a9b11a45ef0ecad69107f5884b5dbbb7b806e1c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          graalvm: '22.1.0.1-Final'
          jdk: java17
          arch: aarch64
      - name: Compile native storage check
        run: |
          mvn -B package dependency:copy-dependencies -DincludeScope=runtime
          native-image --no-fallback -H:+ReportExceptionStackTraces '-H:IncludeResources=.*SQLite.meta|.*sqlite-jdbc.properties|META-INF/services/.*' --initialize-at-run-time=core,client,map,template,ai,event,event_daily,gamble,io,offline,com.google.common.jimfs --initialize-at-build-time=com.google.common.jimfs.SystemJimfsFileSystemProvider -cp 'target/classes:target/test-classes:target/dependency/*' -H:Name=native-storage-check offline.SQLiteCheck
      - name: Exercise SQLite through native code
        run: |
          mkdir -p storage
          python3 -c "import sqlite3; c=sqlite3.connect('storage/hso.sqlite'); c.execute('create table seed (id integer)'); c.commit(); c.close()"
          ./native-storage-check storage write
          ./native-storage-check storage read
